openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0
  description: This document provides detailed information about the API endpoints for this project.

components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /auth/send-otp:
    post:
      summary: Send a one-time password (OTP) to a user's phone.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: A 10-digit phone number.
                  example: '9876543210'
              required:
                - phone
      responses:
        '200':
          description: OTP sent successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        example: {}
                      message:
                        type: string
                        example: 'OTP sent successfully'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Phone number must be a valid 10-digit number'

  /auth/verify-otp:
    post:
      summary: Verify the OTP and log in the user.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: The 10-digit phone number that received the OTP.
                  example: '9876543210'
                otp:
                  type: string
                  description: The 4 or 6-digit OTP code.
                  example: '123456'
              required:
                - phone
                - otp
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                          refresh_token:
                            type: string
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              role:
                                type: string
                                enum: [ADMIN, STAFF]
                              shop_id:
                                type: string
                                format: uuid
                      message:
                        type: string
                        example: 'Login successful'
        '400':
          description: Invalid input for phone or OTP format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed due to incorrect, expired, or used OTP.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid or expired OTP'

  /auth/refresh-token:
    post:
      summary: Obtain a new access token using a refresh token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token provided during login.
              required:
                - refresh_token
      responses:
        '200':
          description: Access token refreshed successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                      message:
                        type: string
                        example: 'Access token refreshed'
        '400':
          description: Missing refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Invalid or expired refresh token'

  /auth/logout:
    post:
      summary: Log out the user by revoking their refresh token.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to revoke.
              required:
                - refresh_token
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        example: {}
                      message:
                        type: string
                        example: 'Logged out successfully'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/onboard-shop:
    post:
      summary: Onboard a new shop owner and their shop.
      tags:
        - Internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_name:
                  type: string
                  example: 'John Doe'
                owner_phone:
                  type: string
                  description: A 10-digit phone number for the owner.
                  example: '9876543211'
                shop_name:
                  type: string
                  example: 'Johns General Store'
                shop_phone:
                  type: string
                  description: A 10-digit phone number for the shop.
                  example: '9876543212'
              required:
                - owner_name
                - owner_phone
                - shop_name
                - shop_phone
      responses:
        '201':
          description: Shop owner onboarded successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shop:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              phone:
                                type: string
                          owner:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              phone:
                                type: string
                              role:
                                type: string
                                example: 'OWNER'
                      message:
                        type: string
                        example: 'Shop owner onboarded successfully'
        '400':
          description: Invalid input or duplicate entry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - "owner_phone must be a valid 10-digit number"
                          - "User with this phone number already exists"
                          - "Shop with this phone number already exists"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
