  /orders:
    post:
      tags: [Orders]
      summary: Place an order from a catalog
      description: |
        Public endpoint to place an order from a shared catalog.
        Redirects buyer to WhatsApp after successful order creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      whatsapp_url:
                        type: string
                        format: uri
                        example: "https://wa.me/919876543210?text=Order%20ID%20123"
                  message:
                    type: string
                    example: "Order placed successfully"

        '400':
          description: Validation error or product unavailable

    get:
      tags: [Orders]
      summary: List orders
      description: List all orders for the logged-in shop
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  message:
                    type: string

        '401':
          description: Unauthorized

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
